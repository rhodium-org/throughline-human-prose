[project]
name = "Human prose — avoid AI-writing tells (throughline source)"
format_version = 3

# A throughline *source*: a standalone graph a consuming project composes via
# throughline-compose, importing it under a namespace (e.g. `human`) and referencing
# principles as `human:UR-0001` or rules as `human:SR-0001`. The UIDs here are this
# source's own and immutable; the dimension reference lives in `attrs.source_ref`,
# never in the UID.
#
# This is the *human prose* axis — write so the text does NOT read as machine
# generated. It is the neutral / opposite form of the tells catalogued in Wikipedia's
# "Signs of AI writing" field guide (WikiProject AI Cleanup): regression-to-the-mean
# puffery, tacked-on significance, vague attribution, negative parallelisms, the rule
# of three, copula avoidance, the flagged "AI vocabulary", mechanical emphasis,
# assistant-to-user framing, tool/citation markup artifacts, and unverifiable
# references. Each such tell becomes a rule stating the plain human alternative.
#
# It deliberately OVERLAPS and reinforces neighbouring axes (`plain-language`, `tone`,
# `conventions`) but from a distinct intent: not "be clear", "be neutral" or "spell it
# correctly", but "carry no statistical fingerprint of generated text". Two pieces of
# writing can be equally plain, neutral in register and correctly spelled, yet one
# reads as AI-written and the other does not — that difference is what this axis owns.
# It governs nothing about readability targets, register, spelling, genre, medium or
# brand voice; each of those is its own throughline source.
#
# The rules are original house guidance, licensed under Apache-2.0; nothing here
# reproduces a third-party standard (the Wikipedia page is CC BY-SA advice, cited as
# the source of the observed tells, not reproduced). Each principle is a
# `user_requirement`; each concrete rule is a `system_requirement` that `implements`
# its principle.

[grounding]
root_types = ["intent"]
delivery_roots = ["intent"]
ground_link_types = ["derives_from", "implements"]
ai_origins = ["ai", "hybrid"]

[types.user_requirement]
attrs.source_ref = { required = true }

[types.system_requirement]
attrs.source_ref = { required = true }

[links]
types = ["derives_from", "implements", "relates"]

[link_rules]
derives_from = { from = ["user_requirement"], to = ["intent"] }
implements   = { from = ["system_requirement"], to = ["user_requirement"] }

[status]
values = ["proposed", "draft", "deferred", "approved", "ratified", "implemented",
          "verified", "suspect", "rejected", "deleted"]

[transitions]
proposed    = ["draft", "approved", "ratified", "deferred", "rejected", "deleted"]
draft       = ["approved", "deferred", "rejected", "deleted"]
deferred    = ["draft", "approved", "rejected", "deleted"]
approved    = ["ratified", "implemented", "deferred", "suspect", "rejected", "deleted"]
ratified    = ["implemented", "suspect", "rejected", "deleted"]
implemented = ["verified", "suspect", "rejected", "deleted"]
verified    = ["implemented", "suspect", "deleted"]
suspect     = ["approved", "ratified", "implemented", "verified", "rejected", "deleted"]
rejected    = ["draft", "deleted"]

# `tl docs` regenerates docs/spec.md + README.md from the graph; `tl docs --check`
# gates them so the published counts and tables can never drift.
[docs]
paths = ["docs/*.md", "README.md"]

# Semantic status roles (SR-0131): which declared status
# plays each role the tool's operations act on. Backfilled by
# `tl migrate`; edit to match your own status vocabulary.
[status.roles]
initial = "draft"
proposed = "proposed"
ratified = "ratified"
invalidated = "rejected"
suspect = "suspect"
tombstone = "deleted"
