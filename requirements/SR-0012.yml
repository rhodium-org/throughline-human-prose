uid: SR-0012
type: system_requirement
status: approved
title: "Repeat the right word rather than varying it for its own sake"
text: "Do not substitute synonyms merely to avoid using the same word twice (elegant variation). If a term is the correct and clear one, repeat it; forced variation reads as generated and can blur meaning."
