uid: SR-0013
type: system_requirement
status: approved
title: "Use the plain copula; do not avoid \"is\", \"are\" and \"has\""
text: "Write \"the library is\", \"the parts are\", \"the town has\". Do not replace them with \"serves as\", \"functions as\", \"represents\", \"stands as\", \"boasts\", \"features\" or \"offers\" when the plain verb is what you mean."
