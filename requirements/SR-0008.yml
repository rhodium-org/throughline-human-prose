uid: SR-0008
type: system_requirement
status: approved
title: "Do not tack a significance clause onto the end of a sentence"
text: "Avoid the trailing present-participle flourish that gestures at meaning without adding any — \"..., highlighting its importance\", \"..., reflecting broader trends\", \"..., ensuring lasting impact\". End the sentence at the fact it actually reports."
