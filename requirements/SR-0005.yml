uid: SR-0005
type: system_requirement
status: approved
title: "Name the source of an opinion; avoid vague authorities"
text: "Attribute any opinion or contested claim to a specific, named person or publication. Do not write \"experts argue\", \"observers have noted\", \"industry reports suggest\" or \"some critics say\" in place of an actual source."
