title: "Use plain, direct verbs and ordinary vocabulary"
text: "Prefer the simple copula and the ordinary word to the flagged register of generated prose — its avoidance of \"is\" and \"has\", and its recurring vocabulary of delve, tapestry, testament, underscore, pivotal, robust and the like."
