uid: UR-0002
type: user_requirement
status: proposed
title: Attribute claims to named sources, not vague authorities
text: Attribute every opinion or contested claim to a specific, named source, and
  do not overstate how many sources hold a view or editorialise about a subject's
  notability or coverage.
normative: true
