title: "Emphasise and format with restraint"
text: "Avoid the mechanical formatting habits of chatbot output — Title Case headings, pervasive boldface, everything-as-a-bullet-list, dense em dashes and decorative emoji — and reserve emphasis and structure for where the content genuinely needs it."
